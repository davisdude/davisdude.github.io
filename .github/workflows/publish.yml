on:
  workflow_dispatch:
  push:
    branches: main

name: Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Copy
        run: |
          mkdir -p site
          # copy your existing static site files here
          rsync -av --exclude '.github' --exclude 'blog' --exclude 'site' ./ site/

      - name: Render
        working-directory: blog
        run: |
          quarto render --output-dir ../site/blog

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
